# JSON Schema for ISO 639-5 entries (alpha-3 code for language families and groups).
# Source: Library of Congress.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://iso24229.org/schemas/iso639/639-5.schema.yaml
title: ISO 639-5 entry
type: object
additionalProperties: false
required: [code, name]
properties:
  code:
    type: string
    pattern: ^[a-z]{3}$
  name:
    type: object
    additionalProperties: false
    properties:
      en:
        type: string
        minLength: 1
      fr:
        type: string
  remarks:
    type: string
